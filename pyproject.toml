[project]
name = "okta-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Okta identity management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.12.5",
    "okta==2.9.13",
    "python-dotenv==1.2.1",
    "uvicorn==0.40.0",
    "fastapi==0.128.5",
    "dateparser==1.3.0",
    "fastmcp==2.13.3",
]

[project.scripts]
okta-mcp-server = "okta_mcp.main:console_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okta_mcp"]

[tool.hatch.version]
path = "okta_mcp/__init__.py"
